// localStorage が SecurityError を投げることがある。起動は止めず、一時保存に切り替える。
const transientSave=Object.create(null);
let autosaveUnavailable=false;
function safeGet(key){
 try{const v=localStorage.getItem(key);if(v!==null)return v}
 catch(e){autosaveUnavailable=true;console.warn('自動保存にアクセスできません',e)}
 return transientSave[key]??null;
}
function safeSet(key,value){
 transientSave[key]=value;
 try{localStorage.setItem(key,value)}catch(e){autosaveUnavailable=true;console.warn('自動保存が利用できません',e)}
}
function safeRemove(key){
 delete transientSave[key];
 try{localStorage.removeItem(key)}catch(e){autosaveUnavailable=true;console.warn('自動保存の削除ができません',e)}
}

const START_SLOTS=6,RELIEF_SLOTS=6,CLOSER_INDEX=START_SLOTS+RELIEF_SLOTS;
const NORMAL_SLOTS=[6,7],SETUP_SLOTS=[8,9],MOPUP_SLOTS=[10,11];
const PITCH_LAYOUT_VERSION=7;
const MAX_RELIEF_APPEARANCES=55,MIXED_IP_CAP=100,STARTER_IP_CAP=200;
const slotPitchRole=i=>i<START_SLOTS?'先':i<CLOSER_INDEX?'中':'抑';
// セーブ互換：旧版には roles がないため、元の起用適性から決定的に補完する。
function pitchRoles(p){
 if(p.kind!=='p')return [];
 if(Array.isArray(p.roles)&&p.roles.length)return p.roles;
 const idNum=Number(String(p.id).replace(/\D/g,''))||0;
 const nat=p.natural||'中';
 return nat==='先'?(idNum%3===0?['先','中']:['先']):nat==='中'?(idNum%4===0?['先','中']:idNum%3===0?['中','抑']:['中']):(idNum%2===0?['中','抑']:['抑']);
}
const hasPitchRole=(p,r)=>pitchRoles(p).includes(r);
const mixedStarter=p=>p?.kind==='p'&&hasPitchRole(p,'先')&&pitchRoles(p).length>1;
const maxPitchOuts=p=> (mixedStarter(p)?(p.stats.GS>0?MIXED_IP_CAP:125):hasPitchRole(p,'先')?STARTER_IP_CAP:125)*3;
function canPitchInGame(p,asStarter=false){
 if(!p||p.kind!=='p'||p.stats.G>=MAX_RELIEF_APPEARANCES)return false;
 if(asStarter&&mixedStarter(p)&&p.stats.outs+3>MIXED_IP_CAP*3)return false;
 const limit=maxPitchOuts(p);
 // 1イニング分の余裕がある投手だけを次のイニングに起用する。
 return p.stats.outs+3<=limit && (!asStarter||hasPitchRole(p,'先'));
}

const generatedNames=new Set();
function makeUniquePlayerName(){
 const combinations=FAMILY.length*GIVEN.length;
 for(let tries=0;tries<100;tries++){
  const result=choose(FAMILY)+' '+choose(GIVEN);
  if(!generatedNames.has(result)){generatedNames.add(result);return result}
 }
 // 非常に長いセーブでも、可能な組み合わせを最後まで探して重複を防ぐ。
 const offset=ri(0,combinations-1);
 for(let i=0;i<combinations;i++){
  const idx=(offset+i)%combinations;
  const result=FAMILY[Math.floor(idx/GIVEN.length)]+' '+GIVEN[idx%GIVEN.length];
  if(!generatedNames.has(result)){generatedNames.add(result);return result}
 }
 // 全組み合わせを使い切るほど長いプレイにも対応。
 let suffix=2,result='';do{result=choose(FAMILY)+' '+choose(GIVEN)+'（'+suffix+++'）'}while(generatedNames.has(result));
 generatedNames.add(result);return result;
}

function calculateAwards(){

 for(const league of ['セ','パ']){
  const roster=TEAMS.filter(t=>t.league===league).flatMap(t=>state.teams[t.id].roster.map(p=>({p,teamId:t.id})));
  leagueAwards[league]=[];
  for(const def of AWARD_DEFS){
   let eligible=roster.filter(x=>x.p.kind===def.kind&&(!def.eligible||def.eligible(x.p.stats)));
   // 規定到達者がいない場合はタイトルを空欄にする。記録のない選手を選出しない。
   if(!eligible.length)continue;
   eligible.sort((a,b)=>def.low?def.get(a.p.stats)-def.get(b.p.stats):def.get(b.p.stats)-def.get(a.p.stats));
   const best=def.get(eligible[0].p.stats);
   // 同率トップは同時受賞（率は小数4桁で判定）
   const winners=eligible.filter(x=>Math.abs(def.get(x.p.stats)-best)<(def.key==='AVG'||def.key==='OBP'||def.key==='ERA'||def.key==='WPCT'?0.00005:0.00001));
   for(const {p,teamId} of winners){
    p.titles ||= [];
    if(!p.titles.some(x=>x.year===state.year&&x.key===def.key))p.titles.push({year:state.year,league,key:def.key,title:def.name});
   }
   leagueAwards[league].push({key:def.key,title:def.name,winners:winners.map(({p,teamId})=>({id:p.id,name:p.name,teamId,display:def.display(p.stats)}))});
  }
 }
 return {year:state.year,leagues:leagueAwards};
}

function devSeries(players,scoreFn){

}
function scoutLevel(deviation){return deviation<=30?'難':deviation<=44?'並':deviation<=54?'良':deviation<65?'優':'極'}

function getDraftScouting(){

   const raw=draftRawCategories(p);
   result[p.id]={scout:totalDev(scoutTotal(p)),categories:Object.fromEntries(fields.map(k=>[k,scoutLevel(devs[k](raw[k]))]))};

// COM's only 1st-round strategy: identify its worst-performing starter position from the
// completed regular season, then bid on the highest-scouted available player eligible there.
// Fielding position uses its actual starting player (the DH is not a defensive position).
function weakestStarterPosition(team){
 const lineup=team.lineup||[];let weakest=null;
 for(const slot of lineup){
  const p=team.roster.find(x=>x.id===slot.id&&x.kind==='b');
  if(!p||!ROLE_B.includes(slot.role)||slot.role==='指')continue;
  const st=p.seasons?.find(x=>x.year===state.year)?.stats||p.stats||newStats('b');
  // Weighted OPS plus field performance per game, giving defensive positions a small
  // defensive component. Low-PA fallback avoids treating a new player as a zero-OPS bust.
  const hasSample=(st.PA||0)>=80;
  const offense=hasSample?Number(ops(st))*100:hitScore(p)*.9;
  const defense=slot.role==='指'?0:((st.UZR||0)*10-(st.E||0)*4)/Math.max(10,st.G||0);
  const score=offense+defense;
  if(!weakest||score<weakest.score)weakest={role:slot.role,position:DEF[slot.role],score};

}

function firstRoundDraw(selectedId,quiet=false){

function parseScheduleCSV(raw){
 const lines=raw.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(lines.length&&/^(date|日付),/i.test(lines[0]))lines.shift();
 const dates=new Map(),pair=new Map(),total=Object.fromEntries(TEAMS.map(t=>[t.id,0]));
 const ids=new Set(TEAMS.map(t=>t.id));
 let count=0;
 for(const [i,line] of lines.entries()){
  const parts=line.split(',').map(x=>x.trim()),[date,h,a]=parts;
  if(parts.length<3||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!ids.has(h)||!ids.has(a)||h===a)throw Error(`${i+1}行目: 日付または球団IDが不正です。`);
  if(!date.startsWith(String(state.year)+'-'))throw Error(`${i+1}行目: シーズン年が一致しません。`);
  const d=new Date(date+'T12:00:00');if(!Number.isFinite(d.getTime())||`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`!==date)throw Error(`${i+1}行目: 存在しない日付です。`);
  const key=[h,a].sort().join(':'),kind=meta(h).league===meta(a).league?'リーグ':'交流戦';
  pair.set(key,(pair.get(key)||0)+1);total[h]++;total[a]++;count++;
  if(!dates.has(date))dates.set(date,[]);
  if(dates.get(date).some(m=>[m.home,m.away].includes(h)||[m.home,m.away].includes(a)))throw Error(`${date}: 同じ球団が同日に2試合あります。`);
  dates.get(date).push({home:h,away:a,kind,result:null});
 }
 if(count!==858)throw Error(`総試合数が${count}です。858試合必要です。`);
 if(Object.values(total).some(n=>n!==143))throw Error('各球団143試合になっていません。');
 for(let i=0;i<TEAMS.length;i++)for(let j=i+1;j<TEAMS.length;j++){
  const a=TEAMS[i],b=TEAMS[j],expected=a.league===b.league?25:3;
  if((pair.get([a.id,b.id].sort().join(':'))||0)!==expected)throw Error(`${a.short}対${b.short}の試合数が${expected}試合ではありません。`);
 }
 return [...dates].sort(([a],[b])=>a.localeCompare(b)).map(([date,games])=>({date,games}));
}

 ${active&&state.day===0?`<div class="card"><div class="card-body"><div class="split-actions"><div><strong>正式日程のCSV読み込み（任意）</strong><div class="small">NPBの全カードが公開されたら、date,home,away の858試合のCSVを読み込めます。</div></div><label class="btn secondary mini" style="cursor:pointer">日程CSVを読み込む<input class="sr-only" type="file" id="importSchedule" accept=".csv,text/csv"></label></div><div class="hint" style="margin-top:9px">記入例：2027-03-26,T,G（球団ID：${TEAMS.map(t=>t.id).join(', ')}）。読み込み後は各日の試合数・休日がCSV通りになります。</div></div></div>`:''}

function prospectCard(p,mode,ratings){
 const draft=mode==='draft',taken=draft?state.draftTaken[p.id]:false;
 const picked=mode==='freeagency'?state.faChoice.includes(p.id):state.draftChoice.includes(p.id);
 const attrs=p.kind==='b'?`弾${p.arc}　ミート${p.meet}　パワー${p.power}　走力${p.speed}　守備${p.field}　肩力${p.arm}　捕球${p.catch}`:`球威${p.stuff}　制球${p.control}　スタミナ${p.stamina}`;
 const rating=draft?ratings[p.id]:null;
 let act='';
 if(draft)act=taken?`<span class="small">${escapeHTML(meta(taken).short)}が指名済み</span>`:`<button class="btn mini" data-action="draft-pick" data-id="${p.id}">この選手を指名</button>`;
 else act=`<button class="btn mini ${picked?'danger':'secondary'}" data-action="freeagent-pick" data-id="${p.id}">${picked?'選択を取り消す':'獲得候補にする'}</button>`;

}

function playerCareerHtml(p){
 const finished=[...(p.seasons||[])].sort((a,b)=>a.year-b.year);
 const rows=finished.map(x=>({year:x.year,teamId:x.teamId,age:x.age,stats:x.stats,ongoing:false}));
 if(!finished.some(x=>x.year===state.year)&&p.stats?.G>0)rows.push({year:state.year,teamId:Object.values(state.teams).find(t=>t.roster.some(z=>z.id===p.id))?.id,age:p.age,stats:p.stats,ongoing:true});
 const keys=p.kind==='b'?['G','PA','AB','H','HR','RBI','SB','E','BB','SO']:['G','GS','outs','W','L','SV','HLD','HP','SO','BB','H'];
 const total=Object.fromEntries(keys.map(k=>[k,rows.reduce((z,x)=>z+(Number(x.stats[k])||0),0)]));
 const batting=p.kind==='b';
 const totals=batting?[['試合',total.G],['打率',avg(total)],['安打',total.H],['本塁打',total.HR],['打点',total.RBI],['盗塁',total.SB]]:
  [['登板',total.G],['先発',total.GS],['勝利',total.W],['防御率',era({...total,ER:rows.reduce((z,x)=>z+(x.stats.ER||0),0)})],['セーブ',total.SV],['ホールド',total.HLD],['奪三振',total.SO]];
 const headings=batting?['年度','所属','試合','打率','安打','本塁打','打点','盗塁','OPS']:['年度','所属','登板','先発','勝','敗','防御率','投球回','HP','セーブ'];
 const fields=x=>batting?[x.year+(x.ongoing?'*':''),meta(x.teamId)?.short||'—',x.stats.G,avg(x.stats),x.stats.H,x.stats.HR,x.stats.RBI,x.stats.SB,ops(x.stats)]:
  [x.year+(x.ongoing?'*':''),meta(x.teamId)?.short||'—',x.stats.G,x.stats.GS,x.stats.W,x.stats.L,era(x.stats),`${Math.floor((x.stats.outs||0)/3)}.${(x.stats.outs||0)%3}`,x.stats.HP||0,x.stats.SV];
 return `<div class="record-subtitle">📊 通算成績${rows.some(x=>x.ongoing)?'（今季途中を含む）':''}</div><div class="career-row">${totals.map(([label,value])=>`<span class="career-chip">${label}<b>${value}</b></span>`).join('')}</div><div class="record-subtitle">📅 年度別成績</div><div class="tablewrap"><table class="record-table"><thead><tr>${headings.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(x=>`<tr>${fields(x).map(y=>`<td>${escapeHTML(y)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headings.length}">出場記録なし</td></tr>`}</tbody></table></div><div class="record-subtitle">🏅 タイトル獲得歴</div><div>${p.titles?.length?p.titles.slice().sort((a,b)=>b.year-a.year).map(t=>`<span class="trophy-tag">🏆 ${t.year}年 ${t.league} ${escapeHTML(t.title)}</span>`).join(''):'タイトル獲得なし'}</div>${p.draft1?`<p class="small" style="margin-bottom:0"><b>🎖️ ${p.draft1.year}年 ドラフト1位入団</b>（${meta(p.draft1.team)?.short||''}）</p>`:''}`;
}

function playerInspector(){
 const id=state.inspectId;if(!id)return '';
 const p=[...Object.values(state.teams).flatMap(t=>t.roster),...(state.pool||[]),...(state.draftPool||[]),...(state.faPool||[])].find(x=>x.id===id);
 if(!p)return '';
 if(state.phase==='draft'&&state.draftPool.some(x=>x.id===p.id)){

function render(){
 if(!state)return;
 if(state.phase==='select')state.view='select';
 if(['draft','freeagency','release'].includes(state.phase)&&!['draft','season','stats','roster','history'].includes(state.view))state.view='draft';
 let content;
 switch(state.view){
  case 'select':content=renderSelect();break;
  case 'review':content=renderReview();break;
  case 'regularChamp':case 'japanChamp':content=renderChampionship();break;
  case 'postseason':content=renderPostseason();break;
  case 'summary':content=renderSummary();break;
  case 'awards':content=renderAwards();break;
  case 'lineup':content=renderLineup();break;
  case 'season':content=renderSeason();break;
  case 'stats':content=renderStats();break;
  case 'roster':content=renderRoster();break;
  case 'history':content=renderHistory();break;
  case 'draft':content=renderDraft();break;
  default:content=renderSeason();
 }
 $('#app').innerHTML=renderHeader()+`<main class="main">${autosaveUnavailable?'<div class="callout warn">このブラウザでは自動保存が使えない可能性があります。ゲームは遊べますが、閉じる前に下の「セーブデータを書き出す」でバックアップしてください。GitHub Pagesなどの公開URLで開くと改善することがあります。</div>':''}${renderNav()}${renderProgressToolbar()}${content}${playerInspector()}${renderDraftLottery()}<div class="footer"><span>ペナントラボ・非公式ファン制作プロトタイプ｜球団・選手は全て架空｜外部通信なし</span><div class="tools" style="justify-content:center;margin-top:10px"><button class="btn secondary mini" data-action="export">セーブデータを書き出す</button><label class="btn secondary mini" style="cursor:pointer">セーブデータを読み込む<input class="sr-only" type="file" id="importSave" accept=".json,application/json"></label><button class="btn danger mini" data-action="reset">最初から</button></div></div></main>`;
}
function autoPick(){
 const bats=state.pool.filter(p=>p.kind==='b'),pits=state.pool.filter(p=>p.kind==='p');
 const choice=[],seen=new Set();
 for(const [pos,n] of [['捕',2],['一',1],['二',1],['三',1],['遊',1],['外',4]]){
  let count=0;
  for(const p of bats.filter(p=>p.positions.includes(pos)&&!seen.has(p.id)).sort((a,b)=>hitScore(b)-hitScore(a))){
   if(count>=n)break;choice.push(p);seen.add(p.id);count++;
  }
 }
 for(const p of bats.filter(p=>!seen.has(p.id)).sort((a,b)=>hitScore(b)-hitScore(a))){if(choice.length>=15)break;choice.push(p);seen.add(p.id)}
 const sp=pits.filter(p=>p.natural==='先').sort((a,b)=>pitchScore(b)-pitchScore(a)).slice(0,5);
 const pp=pits.filter(p=>!sp.includes(p)).sort((a,b)=>pitchScore(b)-pitchScore(a)).slice(0,10);
 state.selection=[...choice,...sp,...pp].map(p=>p.id);persist();render();
}

const methods={

 'reset':()=>{if(confirm('保存した全シーズンのデータを消して最初からやり直しますか？')){safeRemove(STORE);setupNew()}},

document.addEventListener('click',e=>{if(e.target.classList?.contains('modal-shell')){state.inspectId=null;render();return;}const el=e.target.closest('[data-action]');if(el&&methods[el.dataset.action]&&!el.disabled)methods[el.dataset.action](el)});
document.addEventListener('change',async e=>{
 const el=e.target,k=el.dataset.kind,v=el.value;
 if(el.id==='selectTeam'){state.userId=v;persist();render();return}

 if(el.id==='importSchedule'){
  if(!el.files?.[0]||state.phase!=='season'||state.day!==0)return;
  try{const schedule=parseScheduleCSV(await el.files[0].text());if(confirm(`全${schedule.length}開催日のCSV日程に切り替えますか？`)){state.schedule=schedule;state.scheduleSource='csv';persist();render()}}catch(err){alert('日程CSVに問題があります。'+err.message)}return;
 }
 if(el.id==='importSave'){
  if(!el.files?.[0])return;
  try{const imported=JSON.parse(await el.files[0].text());if(imported.version!==1||!imported.teams||!Array.isArray(imported.schedule)||imported.schedule.length!==143)throw Error('不正なデータ');if(confirm('現在のセーブデータを読み込んだデータで上書きしますか？')){safeSet(STORE,JSON.stringify(imported));load();render()}}
  catch(err){alert('セーブデータを読み込めませんでした。 '+err.message)}return;
 }
 if(k==='readonly'){el.checked=false;return}
 if(k==='pool'){
  if(el.checked){const picked=selectedPlayers().filter(p=>p.kind===state.pool.find(p=>p.id===v).kind).length;if(picked>=15){alert('同じ種類の選手は15人までです。');el.checked=false;return}state.selection.push(v)}else state.selection=state.selection.filter(id=>id!==v);
 }else if(k==='bat-role'){user().lineup[Number(el.dataset.index)].role=v;ensureUsageLocks(user());user().batLocks[Number(el.dataset.index)]=false;}
 else if(k==='bat-player'){user().lineup[Number(el.dataset.index)].id=v;ensureUsageLocks(user());user().batLocks[Number(el.dataset.index)]=false;syncPinchWithBench(user());}
 else if(k==='pitch-player'){user().pitching[Number(el.dataset.index)]=v;ensureUsageLocks(user());user().pitchLocks[Number(el.dataset.index)]=false;}
 else if(k==='pinch'){user().pinch=v;}
 else if(k==='draft'){
  if(el.checked){if(state.draftChoice.length>=6){el.checked=false;alert('ドラフト指名は6人までです。');return}state.draftChoice.push(v)}else state.draftChoice=state.draftChoice.filter(id=>id!==v);
 }else if(k==='release'){
  if(el.checked)state.releaseChoice.push(v);else state.releaseChoice=state.releaseChoice.filter(id=>id!==v);
 }
 persist();render();
});
